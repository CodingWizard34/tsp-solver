[build-system]
requires = ["setuptools>=61.0", "cython"]
build-backend = "setuptools.build_meta"

[project]
name = "dijkstra-fast-cpp"
version = "0.1.0"
authors = [
    { name = "CodingWizard34", email = "developer@example.com" }
]
description = "A blazing fast C++ Dijkstra shortest path routing solver wrapped in Cython with map intersection and JSON path export"
readme = "README.md"
requires-python = ">=3.8"
keywords = ["dijkstra", "shortest-path", "graph-algorithms", "cython", "cplusplus", "map-routing", "navigation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics",
]
